<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf7"/>
      <stop offset=".48" stop-color="#f5f1e9"/>
      <stop offset="1" stop-color="#faf9f6"/>
    </linearGradient>
    <linearGradient id="foldA" x1=".08" y1=".08" x2=".9" y2=".9">
      <stop stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".42" stop-color="#e8e0d3" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#cfc3b1" stop-opacity=".19"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="foldB" x1=".1" y1="1" x2=".95" y2=".05">
      <stop stop-color="#d8cdbd" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".64"/>
      <stop offset=".54" stop-color="#ddd3c5" stop-opacity=".22"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#e9e2d7" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="softLight" cx=".5" cy=".5" r=".5">
      <stop stop-color="#fff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="2" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
    </filter>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
