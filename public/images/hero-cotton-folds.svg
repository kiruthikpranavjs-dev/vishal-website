  <rect width="1600" height="1000" fill="url(#cloth)"/>
  <path d="M-140 40 C180 110 245 300 510 345 C760 388 880 230 1125 255 C1325 276 1450 410 1740 365 L1740 665 C1425 720 1300 560 1080 548 C840 535 720 690 475 650 C210 607 115 445 -140 410Z" fill="url(#foldA)"/>
  <path d="M-100 520 C185 470 315 625 520 712 C735 802 880 735 1070 650 C1275 558 1430 628 1710 790 L1710 1080 L-100 1080Z" fill="url(#foldB)"/>
  <path d="M-80 405 C180 455 255 575 495 608 C735 640 860 488 1090 480 C1320 470 1455 610 1690 625" fill="none" stroke="#bfb19e" stroke-opacity=".14" stroke-width="76" filter="url(#soften)"/>
  <path d="M-100 377 C190 424 270 542 503 566 C740 590 875 446 1098 439 C1320 432 1480 570 1710 590" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="43" filter="url(#soften)"/>
